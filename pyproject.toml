[project]
name = "notion-triage-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guy Nutman", email = "68562981+guynutman@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.18.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
notion-triage-agent = "notion_triage_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
